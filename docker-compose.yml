version: "3.8"



services:

  
  banco:
    image: mysql:8.0
    container_name: sige_banco
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sige
      MYSQL_USER: sige_user
      MYSQL_PASSWORD: sige_pass
    ports:
      - "3306:3306"
    volumes:
      - dados_banco:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rede_sige

 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sige_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      - banco
    networks:
      - rede_sige

  
  nginx:
    image: nginx:alpine
    container_name: sige_nginx
    restart: unless-stopped
    ports:
      - "8000:80"   
      - "5173:5173" 
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - rede_sige

  
  frontend:
    image: node:20-alpine
    container_name: sige_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - nginx
    networks:
      - rede_sige


volumes:
  dados_banco:


networks:
  rede_sige:
    driver: bridge
