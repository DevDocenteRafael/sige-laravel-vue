services:

  
  banco:
    image: mysql:8.0
    container_name: sige_banco
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Configure DB_ROOT_PASSWORD no .env da raiz}"
      MYSQL_DATABASE: "${DB_DATABASE:-sige}"
      MYSQL_USER: "${DB_USERNAME:-sige_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Configure DB_PASSWORD no .env da raiz}"
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - dados_banco:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rede_sige

 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sige_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:?Configure APP_KEY no .env da raiz}"
      DB_CONNECTION: mysql
      DB_HOST: banco
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-sige}"
      DB_USERNAME: "${DB_USERNAME:-sige_user}"
      DB_PASSWORD: "${DB_PASSWORD:?Configure DB_PASSWORD no .env da raiz}"
    depends_on:
      - banco
    networks:
      - rede_sige

  
  nginx:
    image: nginx:alpine
    container_name: sige_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
      - "127.0.0.1:5173:5173"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - rede_sige

  
  frontend:
    image: node:20-alpine
    container_name: sige_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      VITE_API_BASE_URL: http://nginx:80
    command: sh -c "npm ci && npm run dev -- --host"
    depends_on:
      - nginx
    networks:
      - rede_sige


volumes:
  dados_banco:
  backend_vendor:
  frontend_node_modules:


networks:
  rede_sige:
    driver: bridge
